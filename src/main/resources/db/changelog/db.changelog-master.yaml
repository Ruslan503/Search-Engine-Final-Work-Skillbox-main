databaseChangeLog:

  - changeSet:
      id: 1-create-site-table
      author: you
      changes:
        - createTable:
            tableName: site
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: status_time
                  type: TIMESTAMP

              - column:
                  name: last_error
                  type: TEXT

              - column:
                  name: url
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-create-page-table
      author: you
      changes:
        - createTable:
            tableName: page
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: site_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: path
                  type: VARCHAR(512)
                  constraints:
                    nullable: false

              - column:
                  name: code
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false

        - createIndex:
            indexName: path_index
            tableName: page
            columns:
              - column:
                  name: path

        - addForeignKeyConstraint:
            constraintName: fk_page_site
            baseTableName: page
            baseColumnNames: site_id
            referencedTableName: site
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 3-create-lemma-table
      author: you
      changes:
        - createTable:
            tableName: lemma
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: lemma
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: frequency
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: site_id
                  type: INT
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: lemma
            columnNames: lemma, site_id
            constraintName: uk_lemma_site

        - addForeignKeyConstraint:
            constraintName: fk_lemma_site
            baseTableName: lemma
            baseColumnNames: site_id
            referencedTableName: site
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 4-create-index-search-table
      author: you
      changes:
        - createTable:
            tableName: index_search
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: page_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: lemma_id
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: lemma_rank
                  type: INT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_index_page
            baseTableName: index_search
            baseColumnNames: page_id
            referencedTableName: page
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            constraintName: fk_index_lemma
            baseTableName: index_search
            baseColumnNames: lemma_id
            referencedTableName: lemma
            referencedColumnNames: id
            onDelete: CASCADE
